components:
  schemas:
    cooperations:
      type: array
      items:
        type: object
        properties:
          _id:
            type: string
          offer:
            $ref: "#/components/schemas/offer"
          initiator:
            $ref: "#/components/schemas/user"
          initiatorRole:
            type: string
          receiver:
            $ref: "#/components/schemas/user"
          receiverRole:
            type: string
          price:
            type: number
          status:
            type: string
            enum:
              - pending
              - active
              - declined
              - closed
          needAction:
            type: string
            enum:
              - student
              - tutor
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    cooperationBody:
      type: object
      properties:
        offer:
          $ref: "#/components/schemas/offer"
        receiver:
          $ref: "#/components/schemas/user"
        receiverRole:
          type: string
        price:
          type: number
        status:
          type: string
          enum:
            - pending
            - active
            - declined
            - closed
    cooperation:
      type: object
      properties:
        _id:
          type: string
        offer:
          $ref: "#/components/schemas/offer"
        initiator:
          $ref: "#/components/schemas/user"
        initiatorRole:
          type: string
        receiver:
          $ref: "#/components/schemas/user"
        receiverRole:
          type: string
        price:
          type: number
        status:
          type: string
          enum:
            - pending
            - active
            - declined
            - closed
        needAction:
          type: string
          enum:
            - student
            - tutor
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

