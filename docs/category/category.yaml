paths:
  /categories:
    post:
      security:
        - bearerAuth: []
      tags:
        - Categories
      summary: Create a category
      description: Create category with provided data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category'
            example:
              name: Test Category
      responses:
        '201':
          description: Category created and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/category'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/categories/{categoryId}/subjects/{subjectId}/price-range':
    get:
      security:
        - bearerAuth: []
      tags:
        - Offers
      summary: Find and return min and max price.
      description: Find and return min and max prices of offers in accordance with
        specific role.
      parameters:
        - name: authorRole
          in: query
          required: true
          description: The role used to filter price range results.
          schema:
            type: string
            enum:
              - student
              - tutor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/offer'
              example:
                minPrice: 300
                maxPrice: 500
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: NOT_FOUND
                message: The requested URL was not found.
