paths:
  '/categories/{categoryId}/subjects/{subjectId}/price-range':
    get:
      security:
        - bearerAuth: []
      tags:
        - Offers
      summary: Find and return min and max price.
      description: Find and return min and max prices of offers in accordance with
        specific role.
      parameters:
        - name: authorRole
          in: query
          required: true
          description: The role used to filter price range results.
          schema:
            type: string
            enum:
              - student
              - tutor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/offer'
              example:
                minPrice: 300
                maxPrice: 500
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: NOT_FOUND
                message: The requested URL was not found.
