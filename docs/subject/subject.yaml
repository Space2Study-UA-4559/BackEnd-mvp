paths:
  /subjects:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Find all subjects
      description: Finds and returns a paginated list of subjects. Supports filtering by name and sorting.
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: Case-insensitive name search filter.
        - in: query
          name: sort
          schema:
            type: string
          required: false
          description: Sort options as a JSON string with order and orderBy fields.
        - in: query
          name: skip
          schema:
            type: integer
          required: false
          description: The skip parameter.
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          description: The limit parameter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subjects'
              example:
                count: 2
                items:
                  - _id: 63da8767c9ad4c9a0b0eacd3
                    name: English
                    category: 64884f21fdc2d1a130c24ac0
                    totalOffers:
                      student: 0
                      tutor: 3
                    createdAt: 2022-10-18T13:25:36.292Z
                    updatedAt: 2022-10-18T13:25:36.292Z
                  - _id: 63da8767c9ad4c9a0b0eacd4
                    name: Mathematics
                    category: 64884f33fdc2d1a130c24ac2
                    totalOffers:
                      student: 1
                      tutor: 0
                    createdAt: 2022-10-18T13:25:36.292Z
                    updatedAt: 2022-10-18T13:25:36.292Z
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
  /categories/{id}/subjects:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Find subjects by category
      description: Finds and returns a paginated list of subjects filtered by category id. Supports filtering by name and sorting.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category id used to filter subjects.
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: Case-insensitive name search filter.
        - in: query
          name: sort
          schema:
            type: string
          required: false
          description: Sort options as a JSON string with order and orderBy fields.
        - in: query
          name: skip
          schema:
            type: integer
          required: false
          description: The skip parameter.
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          description: The limit parameter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subjects'
              example:
                count: 1
                items:
                  - _id: 63da8767c9ad4c9a0b0eacd3
                    name: English
                    category: 64884f21fdc2d1a130c24ac0
                    totalOffers:
                      student: 0
                      tutor: 3
                    createdAt: 2022-10-18T13:25:36.292Z
                    updatedAt: 2022-10-18T13:25:36.292Z
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Category with the specified ID was not found.
