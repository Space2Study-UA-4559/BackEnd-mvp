paths:
  /subjects:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Find all subjects
      description: Finds and returns an array with a list of subjects.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subjects'
              example:
                - _id: 6255bc080a71adf9223df134
                  name: English
                  category: 63525e23bf163f5ea609ff27
                  totalOffers:
                    student: 10
                    tutor: 8
                  createdAt: 2023-20-01T13:25:36.292Z
                  updatedAt: 2023-20-01T13:25:36.292Z
                - _id: 6255bc080a71adf9223df135
                  name: Algebra
                  category: 63525e23bf163f5ea609ff29
                  totalOffers:
                    student: 10
                    tutor: 8
                  createdAt: 2023-20-01T13:25:36.292Z
                  updatedAt: 2023-20-01T13:25:36.292Z
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
    post:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Create new subject.
      description: Saves a new subject to the database.
      requestBody:
        required: true
        description: Create new subject.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subjectBody'
            example:
              name: Ukrainian
              category: 63525e23bf163f5ea609ff27
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subject'
              example:
                _id: 6255bc080a71adf9223df136
                name: Ukrainian
                category: 63525e23bf163f5ea609ff27
                totalOffers:
                  student: 10
                  tutor: 8
                createdAt: 2023-20-01T13:25:36.292Z
                updatedAt: 2023-20-01T13:25:36.292Z
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this action.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 409
                code: SUBJECT_ALREADY_EXISTS
                message: Subject with the specified name already exists.
  /categories/{id}/subjects/names:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Find subject names for a category
      description: Finds and returns subject names for the specified category ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the category to fetch subject names from
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
              example:
                - _id: 6255bc080a71adf9223df134
                  name: English
                - _id: 6255bc080a71adf9223df135
                  name: Algebra
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Category with the specified id was not found.
  '/subjects/{id}':
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Find subject by ID
      description: Finds and returns a subject with the specified ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the subject that needs to be fetched
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subject'
              example:
                _id: 6255bc080a71adf9223df134
                name: English
                category: 63525e23bf163f5ea609ff27
                totalOffers:
                  student: 10
                  tutor: 8
                createdAt: 2023-20-01T13:25:36.292Z
                updatedAt: 2023-20-01T13:25:36.292Z
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Subject with the specified id was not found.
    patch:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Update subject by ID
      description: Finds and update a subject with the specified ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the subject that needs to be updated
          schema:
            type: string
      requestBody:
        required: true
        description: Provide required data to update subject.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subjectBody'
            example:
              name: Ukrainian
              category: 63525e23bf163f5ea609ff27
              totalOffers:
                student: 10
                tutor: 8
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Subject with the specified id was not found.
    delete:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Delete subject by ID
      description: Finds and deletes a subject with the specified ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the subject that needs to be deleted
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Subject with the specified id was not found.
