paths:
  /subjects:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Find all subjects
      description: Finds and returns a paginated list of subjects. Supports filtering by name and sorting.
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: Case-insensitive name search filter.
        - in: query
          name: sort
          schema:
            type: string
          required: false
          description: Sort options as a JSON string with order and orderBy fields.
        - in: query
          name: skip
          schema:
            type: integer
          required: false
          description: The skip parameter.
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          description: The limit parameter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subjects'
              example:
                count: 2
                items:
                  - _id: 63da8767c9ad4c9a0b0eacd3
                    name: English
                    category: 64884f21fdc2d1a130c24ac0
                    totalOffers:
                      student: 0
                      tutor: 3
                    createdAt: 2022-10-18T13:25:36.292Z
                    updatedAt: 2022-10-18T13:25:36.292Z
                  - _id: 63da8767c9ad4c9a0b0eacd4
                    name: Mathematics
                    category: 64884f33fdc2d1a130c24ac2
                    totalOffers:
                      student: 1
                      tutor: 0
                    createdAt: 2022-10-18T13:25:36.292Z
                    updatedAt: 2022-10-18T13:25:36.292Z
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
    post:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Create subject
      description: Creates and saves a new subject. Accessible only to authenticated users with the admin role.
      requestBody:
        required: true
        description: Subject data to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subjectBody'
            example:
              name: English
              category: 64884f21fdc2d1a130c24ac0
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subject'
              example:
                _id: 63da8767c9ad4c9a0b0eacd3
                name: English
                category: 64884f21fdc2d1a130c24ac0
                totalOffers:
                  student: 0
                  tutor: 0
                createdAt: 2022-10-18T13:25:36.292Z
                updatedAt: 2022-10-18T13:25:36.292Z
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Category with the specified ID was not found.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationError:
                  value:
                    status: 409
                    code: VALIDATION_ERROR
                    message: Subject validation failed - name - The name field cannot be empty.
                alreadyExists:
                  value:
                    status: 409
                    code: DOCUMENT_ALREADY_EXISTS
                    message: "'name' field(s) must be unique."
  /subjects/{id}:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Find subject by ID
      description: Finds and returns a subject with the specified ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the subject that needs to be fetched
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subject'
              example:
                _id: 63da8767c9ad4c9a0b0eacd3
                name: English
                category: 64884f21fdc2d1a130c24ac0
                totalOffers:
                  student: 0
                  tutor: 3
                createdAt: 2022-10-18T13:25:36.292Z
                updatedAt: 2022-10-18T13:25:36.292Z
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Subject with the specified ID was not found.
    patch:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Update subject
      description: Updates an existing subject by ID. Accessible only to authenticated users with the admin role.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the subject that needs to be updated
          schema:
            type: string
      requestBody:
        required: true
        description: Subject fields to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subjectUpdateBody'
            example:
              name: Mathematics
              category: 64884f21fdc2d1a130c24ac0
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                subjectNotFound:
                  value:
                    status: 404
                    code: DOCUMENT_NOT_FOUND
                    message: Subject with the specified ID was not found.
                categoryNotFound:
                  value:
                    status: 404
                    code: DOCUMENT_NOT_FOUND
                    message: Category with the specified ID was not found.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 409
                code: VALIDATION_ERROR
                message: Subject validation failed - name - The name field cannot be empty.
  /categories/{id}/subjects:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Find subjects by category
      description: Finds and returns a paginated list of subjects filtered by category id. Supports filtering by name and sorting.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category id used to filter subjects.
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: Case-insensitive name search filter.
        - in: query
          name: sort
          schema:
            type: string
          required: false
          description: Sort options as a JSON string with order and orderBy fields.
        - in: query
          name: skip
          schema:
            type: integer
          required: false
          description: The skip parameter.
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          description: The limit parameter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subjects'
              example:
                count: 1
                items:
                  - _id: 63da8767c9ad4c9a0b0eacd3
                    name: English
                    category: 64884f21fdc2d1a130c24ac0
                    totalOffers:
                      student: 0
                      tutor: 3
                    createdAt: 2022-10-18T13:25:36.292Z
                    updatedAt: 2022-10-18T13:25:36.292Z
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Category with the specified ID was not found.
  /categories/subjects/names:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Get subject names
      description: Finds and returns a list of subject names without category filter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subjectNames'
              example:
                - _id: 63da8767c9ad4c9a0b0eacd3
                  name: English
                - _id: 63da8767c9ad4c9a0b0eacd4
                  name: Mathematics
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
  /categories/{id}/subjects/names:
    get:
      security:
        - bearerAuth: []
      tags:
        - Subjects
      summary: Get subject names by category ID
      description: Finds and returns a list of subject names filtered by category id.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category id used to filter subject names.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subjectNames'
              example:
                - _id: 63da8767c9ad4c9a0b0eacd3
                  name: English
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Category with the specified ID was not found.
