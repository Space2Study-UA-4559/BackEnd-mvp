components:
  schemas:
    subjects:
      type: array
      items:
        type: object
        properties:
          _id:
            type: string
          name:
            type: string
          category:
            $ref: "#/components/schemas/category"
          totalOffers:
            type: object
            properties:
              student:
                type: number
                default: 0
              tutor:
                type: number
                default: 0
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    subjectBody:
      type: object
      properties:
        name:
          type: string
        category:
          $ref: "#/components/schemas/category"
    subject:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/category"
        totalOffers:
          type: object
          properties:
            student:
              type: number
              default: 0
            tutor:
              type: number
              default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

