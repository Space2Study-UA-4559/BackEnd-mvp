components:
  schemas:
    reviews:
      type: array
      items:
        type: object
        properties:
          _id:
            type: string
          comment:
            type: string
          rating:
            type: number
          author:
            $ref: "#/components/schemas/user"
          targetUserId:
            $ref: "#/components/schemas/user"
          targetUserRole:
            type: string
          offer:
            $ref: "#/components/schemas/offer"
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    reviewResponse:
      type: object
      properties:
        _id:
          type: string
        comment:
          type: string
        rating:
          type: number
        author:
          $ref: "#/components/schemas/user"
        targetUserId:
          $ref: "#/components/schemas/user"
        targetUserRole:
          type: string
        offer:
          $ref: "#/components/schemas/offer"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    review:
      type: object
      properties:
        comment:
          type: string
        rating:
          type: number
        author:
          $ref: "#/components/schemas/user"
        targetUserId:
          $ref: "#/components/schemas/user"
        targetUserRole:
          type: string
        offer:
          $ref: "#/components/schemas/offer"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    update-review:
      type: object
      properties:
        comment:
          type: string
        rating:
          type: number

