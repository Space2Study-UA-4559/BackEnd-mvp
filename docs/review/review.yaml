            type: string
          required: true
          description: The role parameter.
        - in: query
          name: rating
          schema:
            type: integer
          required: false
          description: The rating parameter.
        - in: query
          name: skip
          schema:
            type: integer
          required: false
          description: The skip parameter.
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          description: The limit parameter.
      responses:
        '200':
          description: OK
