  /users/{id}/reviews/stats:
    get:
      security:
        - bearerAuth: []
      tags:
        - Reviews
      summary: Find review stats for a user with the specified ID and role
      description: Finds and returns review statistics for a user with the specified ID and role.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the user for whom review stats are requested
          schema:
            type: string
        - in: query
          name: role
          required: true
          description: The user role used to filter review stats.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: array
                    items:
                      type: object
                      properties:
                        rating:
                          type: number
                        count:
                          type: number
              example:
                stats:
                  - rating: 5
                    count: 1
                  - rating: 3
                    count: 1
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_ID
                message: ID is invalid.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: User with the specified id was not found.
