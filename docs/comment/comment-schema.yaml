components:
  schemas:
    comment:
      type: object
      properties:
        _id:
          type: string
        author:
          type: object
          properties:
            _id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
        text:
          type: string
        cooperation:
          $ref: '#/components/schemas/cooperation'
        createdAt:
          type: string
        updatedAt:
          type: string
    comments:
      type: array
      items:
        type: object
        properties:
          _id:
            type: string
          author:
            type: object
            properties:
              _id:
                type: string
              firstName:
                type: string
              lastName:
                type: string
          text:
            type: string
          cooperation:
            $ref: '#/components/schemas/cooperation'
          createdAt:
            type: string
          updatedAt:
            type: string
    commentBody:
      type: object
      properties:
        text:
          type: string
      required:
        - text
