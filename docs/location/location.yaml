paths:
  /location/countries:
    get:
      tags:
        - Location
      summary: Get all countries
      description: Returns a unique list of objects which include country names and iso2 from the external location service.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - name
                    - iso2
                  properties:
                    name:
                      type: string
                    iso2:
                      type: string
              example:
              - name: Ukraine
                iso2: UA
              - name: Poland
                iso2: PL
  /location/cities/{country}:
    get:
      tags:
        - Location
      summary: Get cities for a country
      description: Returns a list of cities for the specified country name.
      parameters:
        - name: country
          in: path
          required: true
          description: Country name.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - Kyiv
                - Lviv
                - Odesa
