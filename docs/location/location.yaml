paths:
  /location/countries:
    get:
      tags:
        - Location
      summary: Get all countries
      description: Returns a unique list of country names from the external location service.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - Ukraine
                - Poland
                - Germany
  /location/cities/{country}:
    get:
      tags:
        - Location
      summary: Get cities for a country
      description: Returns a list of cities for the specified country name.
      parameters:
        - name: country
          in: path
          required: true
          description: Country name.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - Kyiv
                - Lviv
                - Odesa
