          schema:
            type: string
          required: false
          description: The nativeLanguage parameter.
        - in: query
          name: excludedOfferId
          schema:
            type: string
          required: false
          description: The excludedOfferId parameter.
        - in: query
          name: status
          schema:
            type: string
          required: false
          description: The status parameter.
        - in: query
          name: sort
          schema:
            type: string
          required: false
          description: The sort parameter.
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          description: The limit parameter.
        - in: query
          name: skip
          schema:
            type: integer
          required: false
          description: The skip parameter.
