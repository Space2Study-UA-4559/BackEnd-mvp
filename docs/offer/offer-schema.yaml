components:
  schemas:
    offers:
      type: array
      items:
        type: object
        properties:
          _id:
            type: string
          price:
            type: number
          proficiencyLevel:
            type: array
            items:
              type: string
              enum:
                - Beginner
                - Intermediate
                - Advanced
                - Test Preparation
                - Professional
                - Specialized
          title:
            type: string
          description:
            type: string
          languages:
            type: array
            items:
              type: string
              enum:
                - English
                - Ukrainian
                - Polish
                - German
                - French
                - Spanish
                - Arabic
          authorRole:
            type: string
          author:
            $ref: "#/components/schemas/user"
          subject:
            $ref: "#/components/schemas/subject"
          category:
            $ref: "#/components/schemas/category"
          status:
            type: string
            enum:
              - active
              - draft
              - closed
          FAQ:
            type: array
            items:
              type: object
              properties:
                question:
                  type: string
                answer:
                  type: string
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    offerBody:
      type: object
      required: [price, proficiencyLevel, title, description, languages, subject, category]
      properties:
        price:
          type: number
          minimum: 1
        proficiencyLevel:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - Beginner
              - Intermediate
              - Advanced
              - Test Preparation
              - Professional
              - Specialized
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        languages:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - English
              - Ukrainian
              - Polish
              - German
              - French
              - Spanish
              - Arabic
        authorRole:
          type: string
        subject:
          $ref: "#/components/schemas/subject"
        category:
          $ref: "#/components/schemas/category"
        status:
          type: string
          enum:
            - active
            - draft
            - closed
        FAQ:
          type: array
          items:
            type: object
            required: [question, answer]
            properties:
              question:
                type: string
              answer:
                type: string
    offer:
      type: object
      properties:
        _id:
          type: string
        price:
          type: number
          minimum: 1
        proficiencyLevel:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - Beginner
              - Intermediate
              - Advanced
              - Test Preparation
              - Professional
              - Specialized
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        languages:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - English
              - Ukrainian
              - Polish
              - German
              - French
              - Spanish
              - Arabic
        authorRole:
          type: string
        author:
          $ref: "#/components/schemas/user"
        subject:
          $ref: "#/components/schemas/subject"
        category:
          $ref: "#/components/schemas/category"
        status:
          type: string
          enum:
            - active
            - draft
            - closed
        FAQ:
          type: array
          items:
            type: object
            required: [question, answer]
            properties:
              question:
                type: string
              answer:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

