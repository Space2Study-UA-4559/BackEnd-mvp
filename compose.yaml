services:
  server:
    container_name: server
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HUSKY: "0"
      MONGODB_URL: mongodb://db:27017/space2study
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    container_name: db
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - db-data:/data/db

volumes:
  db-data:
